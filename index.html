<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOORS ВИКИ — Тир-лист</title><style>*{box-sizing:border-box}body{margin:0;background:#080605;color:#eee;font-family:Georgia,serif}header{padding:28px 15px 18px;text-align:center;background:linear-gradient(#1c0b06,#090605);border-bottom:2px solid #70452d}.logo{font-size:clamp(45px,10vw,90px);font-weight:900;letter-spacing:7px;text-shadow:3px 4px #21140d}.title{font-size:clamp(22px,5vw,42px);letter-spacing:3px;color:#d8c1a8}.nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:18px}.nav button,.back{background:#17100c;color:#eee;border:2px solid #80634d;padding:13px 24px;border-radius:8px;font:700 18px Georgia;cursor:pointer}.nav button:hover,.back:hover{filter:brightness(1.3);border-color:#c39a70}main{width:min(1200px,94vw);margin:auto;padding-bottom:60px}#monsters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:linear-gradient(145deg,#17100c,#0d0a08);border:1px solid #624a39;border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-3px);border-color:#b48b65}.pic{height:145px;background:radial-gradient(circle,#33241a,#090706);display:flex;align-items:center;justify-content:center;color:#8e7968;font-size:14px}.pic img{width:100%;height:100%;object-fit:cover}.name{font-size:21px;font-weight:700;padding:11px 12px 3px}.floor{font-size:12px;color:#aa927b;padding:0 12px 12px}.search{display:block;width:min(600px,90vw);margin:10px auto 22px;padding:14px;background:#110d0a;border:1px solid #73533d;border-radius:8px;color:white;font-size:16px}#detail{display:none;background:#100b08;border:2px solid #75533d;border-radius:12px;padding:18px;max-width:850px;margin:20px auto}.detail-img{width:100%;max-height:380px;object-fit:contain;background:#080605;border-radius:8px;margin-bottom:15px}.detail h2{font-size:36px;margin:5px 0}.label{color:#b99572;font-weight:bold}.guide{font-size:18px;line-height:1.55;color:#e4d8ca}.note{color:#9d8b79;text-align:center;font-size:13px;margin-top:25px}</style></head><body><header><div class="logo">DOORS</div><div class="title">ВИКИ • ТИР-ЛИСТ</div><div class="nav"><button onclick="showTier()">🏆 ТИР-ЛИСТ</button><button onclick="showMonsters()">👹 МОНСТРЫ</button><button onclick="soon()">🧮 КАЛЬКУЛЯТОР</button></div></header><main><section id="home"><h2 style="text-align:center">Выбери раздел</h2></section><section id="monsterSection" style="display:none"><h1 style="text-align:center">👹 МОНСТРЫ</h1><input class="search" id="search" placeholder="Поиск монстра..." oninput="render()"><div id="monsters"></div><div id="detail"></div><div style="text-align:center;margin-top:18px"><button class="back" onclick="showHome()">← В меню</button></div><p class="note">Список и механики могут меняться вместе с обновлениями DOORS.</p></section></main><script>const data=[{"name": "Rush", "floor": "Отель / Шахты", "cue": "Мигают лампы, слышен гул.", "guide": "Спрячься в шкафу, под кроватью или за укрытием и не выходи слишком рано.", "image": "https://static.wikia.nocookie.net/doors-entities-official/images/a/a2/Rush2.webp/revision/latest"}, {"name": "Ambush", "floor": "Отель / Шахты", "cue": "Громкий звук приближения.", "guide": "Спрячься, дождись прохода и будь готов снова прятаться: Ambush возвращается несколько раз.", "image": ""}, {"name": "Seek", "floor": "Отель / Шахты", "cue": "Глаза появляются на стенах, начинается погоня.", "guide": "Беги по маршруту погони, следи за поворотами и пригибайся под препятствиями.", "image": "https://tryhardguides.com/wp-content/uploads/2023/05/roblox-doors-seek-encounter-1024x576.jpg"}, {"name": "Figure", "floor": "Отель / Шахты", "cue": "Тяжёлые шаги и звуки движения.", "guide": "Figure не видит: ходи тихо, не бегай рядом и используй укрытия, когда он близко.", "image": ""}, {"name": "Screech", "floor": "Отель / Шахты / Архивы", "cue": "В тёмной комнате слышно «psst».", "guide": "Быстро ищи Screech взглядом и посвети на него фонарём.", "image": "https://www.touchtapplay.com/wp-content/uploads/2023/03/roblox-doors-how-to-survive-screech.jpg?resize=768%2C432"}, {"name": "Eyes", "floor": "Отель / Шахты / Архивы", "cue": "Появляется группа светящихся глаз.", "guide": "Не смотри на глаза — отвернись и продолжай путь.", "image": "https://static.wikia.nocookie.net/doors-game/images/a/a0/Eyeopt2.webp/revision/latest"}, {"name": "Halt", "floor": "Отель", "cue": "Тёмный коридор и особые звуковые сигналы.", "guide": "Иди вперёд и разворачивайся по сигналу, повторяя это до выхода.", "image": "https://cdn.wikiwiki.jp/to/w/doors_jp/Halt/%3A%3Aref/IMG_0763.webp?rev=d706268c4c7d05ac698ce6ef8233c005&t=20250221120624"}, {"name": "Hide", "floor": "Отель / Шахты", "cue": "Экран предупреждает, если слишком долго сидеть в укрытии.", "guide": "Не сиди в шкафу бесконечно; при необходимости используй другое укрытие.", "image": ""}, {"name": "Dupe", "floor": "Отель / Шахты", "cue": "Подозрительная дверь с неправильным номером.", "guide": "Проверь номер двери перед входом и не открывай дверь с неверным номером.", "image": "https://static.wikia.nocookie.net/doors-game/images/d/d0/DupeRenderNew.png/revision/latest"}, {"name": "Jack", "floor": "Отель / Шахты", "cue": "Может внезапно появиться при попытке спрятаться.", "guide": "Он не наносит урон. Если шкаф занят Джеком, используй другое укрытие.", "image": ""}, {"name": "Timothy", "floor": "Отель / Шахты", "cue": "Редко появляется из ящика.", "guide": "Это маленький паук из ящиков; обычная встреча не убивает игрока.", "image": ""}, {"name": "Dread", "floor": "Отель", "cue": "Редкая встреча, связанная со временем.", "guide": "Не задерживайся слишком долго и продолжай движение к следующей двери.", "image": ""}, {"name": "Void", "floor": "Отель / Шахты", "cue": "Может появиться, когда игроки сильно отстали друг от друга.", "guide": "Держись рядом с группой и не отставай.", "image": ""}, {"name": "Glitch", "floor": "Все этажи", "cue": "Глитч-эффект и телепортация.", "guide": "Обычно это защитная механика; после телепорта продолжай прохождение.", "image": ""}, {"name": "Snare", "floor": "Шахты", "cue": "Опасная ловушка на земле.", "guide": "Смотри под ноги и обходи подозрительные участки пола.", "image": ""}, {"name": "Jeff", "floor": "Шахты / Архивы", "cue": "Магазин Джеффа.", "guide": "Это дружелюбный NPC; используй магазин для покупки предметов.", "image": ""}, {"name": "Bob", "floor": "Отель", "cue": "Встречается в магазине Джеффа.", "guide": "Не является обычной атакующей угрозой; отдельная тактика выживания не нужна.", "image": ""}, {"name": "El Goblino", "floor": "Отель", "cue": "Встречается в магазине Джеффа.", "guide": "Дружелюбный NPC; отдельная тактика выживания не нужна.", "image": ""}, {"name": "Sally", "floor": "Отель", "cue": "Редкое появление.", "guide": "Следи за окружением и продолжай движение.", "image": ""}, {"name": "Shadow", "floor": "Отель", "cue": "Очень редкое внезапное появление.", "guide": "Это короткое появление; продолжай прохождение.", "image": ""}, {"name": "Gloombats", "floor": "Шахты", "cue": "Стаи летающих существ в тёмных местах.", "guide": "Используй свет и не задерживайся в опасных участках.", "image": ""}, {"name": "Giggle", "floor": "Шахты", "cue": "Может находиться на потолке.", "guide": "Смотри вверх и избегай его зоны атаки.", "image": "https://static.wikia.nocookie.net/doors-game/images/5/51/GiggleRender3.png/revision/latest"}, {"name": "Grumble", "floor": "Шахты", "cue": "Опасность в районе Гнезда.", "guide": "Следуй маршруту, используй укрытия и не попадай на путь Grumble.", "image": "https://static.wikia.nocookie.net/doors-game/images/a/a4/GrumbleRender1.png/revision/latest"}, {"name": "Queen Grumble", "floor": "Шахты", "cue": "Главная угроза зоны Гнезда.", "guide": "Следуй маршруту погони и не останавливайся.", "image": ""}, {"name": "Blitz", "floor": "Бэкдор", "cue": "Быстрое приближение в Бэкдоре.", "guide": "Следи за таймером и укрытиями; реагируй на звук и приближение.", "image": ""}, {"name": "Lookman", "floor": "Бэкдор", "cue": "Появляются глаза.", "guide": "Не смотри прямо на Lookman и продолжай движение.", "image": ""}, {"name": "Haste", "floor": "Бэкдор", "cue": "Опасность связана с таймером.", "guide": "Следи за временем и используй рычаги таймера.", "image": ""}, {"name": "A-60", "floor": "The Rooms", "cue": "Быстрое приближение.", "guide": "Услышав приближение, найди укрытие и пережди проход.", "image": ""}, {"name": "A-90", "floor": "The Rooms", "cue": "Внезапная команда/сигнал.", "guide": "Остановись и не двигайся, пока опасность не исчезнет.", "image": ""}, {"name": "A-120", "floor": "The Rooms", "cue": "Быстрое приближение сзади.", "guide": "Слушай звук и заранее находи укрытие.", "image": ""}, {"name": "Groundskeeper", "floor": "Открытые зоны", "cue": "Опасная встреча на открытой территории.", "guide": "Не стой на его пути и быстро уходи из опасной зоны.", "image": ""}, {"name": "Eyestalk", "floor": "Шахты", "cue": "Опасная область с глазами.", "guide": "Не смотри на глаза и проходи участок быстро.", "image": ""}, {"name": "Mandrake", "floor": "Шахты", "cue": "Опасная встреча в подземных зонах.", "guide": "Не задерживайся рядом и следуй безопасному маршруту.", "image": ""}, {"name": "Monument", "floor": "Шахты", "cue": "Опасная сущность в специальной зоне.", "guide": "Держись подальше и продолжай движение по маршруту.", "image": ""}, {"name": "Bramble", "floor": "Открытые зоны", "cue": "Опасная растительность/зона.", "guide": "Не касайся опасных участков и обходи препятствия.", "image": ""}, {"name": "Honcho", "floor": "Архивы", "cue": "Новая сущность Архивов.", "guide": "Следи за визуальными и звуковыми сигналами и используй безопасный маршрут.", "image": ""}, {"name": "Ransom", "floor": "Архивы", "cue": "Новая сущность Архивов.", "guide": "Следи за окружением и реагируй на предупреждающие сигналы.", "image": ""}, {"name": "Drone", "floor": "Архивы", "cue": "Новая сущность Архивов.", "guide": "Следи за зоной действия и не оставайся на открытом месте.", "image": ""}, {"name": "Forget-Me-Nots", "floor": "Архивы", "cue": "Новая сущность Архивов.", "guide": "Будь внимателен к окружению и быстро проходи опасный участок.", "image": ""}, {"name": "Teller", "floor": "Архивы", "cue": "Новая сущность Архивов.", "guide": "Следи за подсказками комнаты и не задерживайся в опасной зоне.", "image": ""}, {"name": "Bash", "floor": "Архивы", "cue": "Новая сущность Архивов.", "guide": "Реагируй на сигнал и используй безопасный маршрут.", "image": ""}, {"name": "Discolorations", "floor": "Архивы", "cue": "Новая сущность Архивов.", "guide": "Обращай внимание на необычные изменения окружения.", "image": ""}, {"name": "Scribbles", "floor": "Архивы", "cue": "Новая сущность Архивов.", "guide": "Следи за сигналами и избегай опасной зоны.", "image": ""}, {"name": "Alma", "floor": "Архивы", "cue": "Новая сущность Архивов.", "guide": "Используй подсказки комнаты и продолжай движение.", "image": ""}, {"name": "Currents", "floor": "Архивы", "cue": "Новая сущность Архивов.", "guide": "Следи за окружающей средой и проходи опасный участок быстро.", "image": ""}];function showHome(){home.style.display='block';monsterSection.style.display='none'}function showMonsters(){home.style.display='none';monsterSection.style.display='block';detail.style.display='none';render();scrollTo(0,0)}function showTier(){alert('Тир-лист уже есть на сайте. Следующим шагом можно открыть твоё изображение прямо по этой кнопке.')}function soon(){alert('СКОРО БУДЕТ')}function render(){let q=search.value.toLowerCase();monsters.innerHTML='';data.filter(x=>(x.name+' '+x.floor).toLowerCase().includes(q)).forEach(x=>{let c=document.createElement('div');c.className='card';c.onclick=()=>openEntity(x);c.innerHTML='<div class="pic">'+(x.image?'<img src="'+x.image+'" alt="'+x.name+'">':'<span>Фото добавим</span>')+'</div><div class="name">'+x.name+'</div><div class="floor">'+x.floor+'</div>';monsters.appendChild(c)})}function openEntity(x){detail.style.display='block';detail.innerHTML=(x.image?'<img class="detail-img" src="'+x.image+'" alt="'+x.name+'">':'')+'<h2>'+x.name+'</h2><p><span class="label">Где встречается:</span> '+x.floor+'</p><p><span class="label">Сигнал:</span> '+x.cue+'</p><p class="guide"><span class="label">Как пройти:</span> '+x.guide+'</p><button class="back" onclick="detail.style.display='none'">← Назад</button>';detail.scrollIntoView({behavior:'smooth'})}</script></body></html>
