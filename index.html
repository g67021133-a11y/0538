<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLITCH9390</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.screen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
.hidden{display:none!important}
h1{font-size:clamp(28px,7vw,64px);margin:0 0 24px}
p{font-size:20px}
input{width:min(330px,90vw);padding:14px 16px;background:#111;border:2px solid #777;color:#fff;font-size:20px;text-align:center;outline:none}
button{padding:14px 22px;margin:8px;background:#151515;color:#fff;border:2px solid #aaa;font-size:18px;cursor:pointer}
button:hover{background:#292929}
#wordStatus,#safeStatus{min-height:28px;margin-top:12px}
#buttonsScreen{position:relative}
#threeButtons{display:flex;flex-wrap:wrap;justify-content:center}
.glitch{animation:shake .08s infinite}
@keyframes shake{
0%{transform:translate(0,0)}
25%{transform:translate(4px,-2px)}
50%{transform:translate(-3px,3px)}
75%{transform:translate(2px,2px)}
100%{transform:translate(0,0)}
}
#ghost{font-size:clamp(30px,10vw,90px);text-shadow:4px 0 #f00,-4px 0 #0ff}
#rush{position:relative}
#rushButton{position:absolute;margin:0}
#rushCounter{position:fixed;top:18px;left:50%;transform:translateX(-50%);font-size:22px}
#codePart{font-size:clamp(80px,20vw,180px);font-weight:bold}
#safeTitle{font-size:clamp(32px,8vw,70px)}
#result{font-size:clamp(24px,6vw,52px)}
</style>
</head>
<body>

<section id="wordi" class="screen">
  <h1>WORDI</h1>
  <p id="wordNumber"></p>
  <input id="wordInput" autocomplete="off" spellcheck="false" placeholder="Введите слово">
  <button id="wordButton">ПРОВЕРИТЬ</button>
  <div id="wordStatus"></div>
</section>

<section id="buttonsScreen" class="screen hidden">
  <h1>НАЙДИ И НАЖМИ 3 КНОПКИ</h1>
  <div id="threeButtons"></div>
</section>

<section id="ghost" class="screen hidden glitch">
  <div>GHOST MENU</div>
</section>

<section id="rush" class="screen hidden">
  <div id="rushCounter">0 / 18</div>
  <button id="rushButton">НАЖМИ</button>
</section>

<section id="codeScreen" class="screen hidden">
  <div id="codePart">(8)</div>
</section>

<section id="safe" class="screen hidden">
  <div id="safeLocked">
    <div id="safeTitle">СЕЙФ</div>
    <p>Введите код для открытия</p>
    <input id="safeCode" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="КОД">
    <br>
    <button id="openSafe">ОТКРЫТЬ СЕЙФ</button>
    <div id="safeStatus"></div>
  </div>
  <div id="result" class="hidden">tiktok.com/@glitch9390</div>
</section>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "glitch9390_state_v6";
  const WORDS = ["йоши", "глитч", "сайори"];
  const SAFE_CODE = "8399";

  const defaultState = () => ({
    solvedWords: 0,
    lastAttemptDate: null,
    stage: 0,
    buttonsRemaining: 3,
    rushProgress: 0,
    safeOpened: false
  });

  function today() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function loadState() {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // Remove states from older broken versions only once.
      [
        "glitch9390_progress_v1",
        "glitch9390_progress_v2",
        "glitch9390_progress_v3",
        "glitch9390_fresh_v4",
        "glitch9390_persistent_v5"
      ].forEach(k => localStorage.removeItem(k));
      const s = defaultState();
      saveState(s);
      return s;
    }
    try {
      const s = Object.assign(defaultState(), JSON.parse(raw));
      s.solvedWords = Math.max(0, Math.min(3, Number(s.solvedWords) || 0));
      s.buttonsRemaining = Math.max(0, Math.min(3, Number(s.buttonsRemaining) || 0));
      s.rushProgress = Math.max(0, Math.min(18, Number(s.rushProgress) || 0));
      return s;
    } catch {
      const s = defaultState();
      saveState(s);
      return s;
    }
  }

  function saveState(s) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  }

  let state = loadState();

  const screens = {
    wordi: document.getElementById("wordi"),
    buttons: document.getElementById("buttonsScreen"),
    ghost: document.getElementById("ghost"),
    rush: document.getElementById("rush"),
    code: document.getElementById("codeScreen"),
    safe: document.getElementById("safe")
  };

  function show(name) {
    Object.values(screens).forEach(x => x.classList.add("hidden"));
    screens[name].classList.remove("hidden");
  }

  function canAttemptToday() {
    return state.lastAttemptDate !== today();
  }

  function renderWordi() {
    show("wordi");
    document.getElementById("wordNumber").textContent =
      `Слово ${state.solvedWords + 1} из 3`;

    const input = document.getElementById("wordInput");
    const btn = document.getElementById("wordButton");
    const status = document.getElementById("wordStatus");
    input.value = "";
    status.textContent = "";

    if (!canAttemptToday()) {
      input.disabled = true;
      btn.disabled = true;
      status.textContent = "Попытка уже использована. Возвращайся завтра.";
    } else {
      input.disabled = false;
      btn.disabled = false;
      input.focus();
    }
  }

  function checkWord() {
    if (!canAttemptToday() || state.solvedWords >= 3) return;

    const input = document.getElementById("wordInput");
    const answer = input.value.trim().toLowerCase();
    state.lastAttemptDate = today();

    if (answer === WORDS[state.solvedWords]) {
      state.solvedWords++;
      input.value = "";
      if (state.solvedWords >= 3) {
        state.stage = 1;
        state.lastAttemptDate = null;
        state.buttonsRemaining = 3;
        saveState(state);
        startButtons();
        return;
      }
      saveState(state);
      document.getElementById("wordStatus").textContent = "Верно! Следующее слово — завтра.";
      input.disabled = true;
      document.getElementById("wordButton").disabled = true;
    } else {
      saveState(state);
      document.getElementById("wordStatus").textContent = "Неверно. Следующая попытка — завтра.";
      input.disabled = true;
      document.getElementById("wordButton").disabled = true;
    }
  }

  document.getElementById("wordButton").addEventListener("click", checkWord);
  document.getElementById("wordInput").addEventListener("keydown", e => {
    if (e.key === "Enter") checkWord();
  });

  function startButtons() {
    state.stage = 1;
    saveState(state);
    show("buttons");
    const wrap = document.getElementById("threeButtons");
    wrap.innerHTML = "";

    for (let i = 0; i < state.buttonsRemaining; i++) {
      const b = document.createElement("button");
      b.textContent = "НАЖМИ";
      b.addEventListener("click", () => {
        b.remove();
        state.buttonsRemaining--;
        saveState(state);
        if (state.buttonsRemaining <= 0) startGhost();
      });
      wrap.appendChild(b);
    }
  }

  function startGhost() {
    state.stage = 2;
    saveState(state);
    show("ghost");

    setTimeout(() => {
      // The stage is saved, so a reload never returns to Wordi.
      startRush();
    }, 10000);
  }

  function positionRushButton() {
    const btn = document.getElementById("rushButton");
    const margin = 60;
    const w = Math.max(80, window.innerWidth - margin*2);
    const h = Math.max(80, window.innerHeight - margin*2);
    const x = Math.floor(Math.random() * (w - 80)) + margin;
    const y = Math.floor(Math.random() * (h - 45)) + margin;
    btn.style.left = x + "px";
    btn.style.top = y + "px";
  }

  function startRush() {
    state.stage = 3;
    saveState(state);
    show("rush");
    document.getElementById("rushCounter").textContent = `${state.rushProgress} / 18`;
    positionRushButton();
  }

  document.getElementById("rushButton").addEventListener("click", () => {
    if (state.stage !== 3) return;
    state.rushProgress++;
    saveState(state);

    if (state.rushProgress >= 18) {
      state.stage = 4;
      saveState(state);
      show("code");
      setTimeout(() => {
        state.stage = 5;
        saveState(state);
        show("safe");
      }, 1200);
      return;
    }

    document.getElementById("rushCounter").textContent = `${state.rushProgress} / 18`;
    positionRushButton();
  });

  window.addEventListener("resize", () => {
    if (state.stage === 3) positionRushButton();
  });

  document.getElementById("openSafe").addEventListener("click", () => {
    const value = document.getElementById("safeCode").value.trim();
    const status = document.getElementById("safeStatus");

    if (value === SAFE_CODE) {
      state.safeOpened = true;
      state.stage = 6;
      saveState(state);
      document.getElementById("safeLocked").classList.add("hidden");
      document.getElementById("result").classList.remove("hidden");
    } else {
      status.textContent = "Неверный код.";
    }
  });

  document.getElementById("safeCode").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("openSafe").click();
  });

  function restoreProgress() {
    if (state.safeOpened || state.stage >= 6) {
      state.safeOpened = true;
      state.stage = 6;
      saveState(state);
      show("safe");
      document.getElementById("safeLocked").classList.add("hidden");
      document.getElementById("result").classList.remove("hidden");
      return;
    }

    if (state.stage === 5) {
      show("safe");
      return;
    }

    if (state.stage === 4) {
      show("code");
      setTimeout(() => {
        if (state.stage === 4) {
          state.stage = 5;
          saveState(state);
          show("safe");
        }
      }, 1200);
      return;
    }

    if (state.stage === 3) {
      startRush();
      return;
    }

    if (state.stage === 2) {
      show("ghost");
      setTimeout(() => {
        if (state.stage === 2) startRush();
      }, 10000);
      return;
    }

    if (state.stage === 1) {
      startButtons();
      return;
    }

    state.stage = 0;
    saveState(state);
    renderWordi();
  }

  restoreProgress();
})();
</script>
</body>
</html>
