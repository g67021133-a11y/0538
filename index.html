<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLITCH9390</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial}body{display:flex;align-items:center;justify-content:center}.s{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.h{display:none!important}input{padding:14px;background:#111;color:white;border:2px solid #777;font-size:20px;text-align:center}button{padding:14px 22px;margin:8px;background:#151515;color:white;border:2px solid #aaa;font-size:18px}#ghost{font-size:70px;text-shadow:4px 0 red,-4px 0 cyan;animation:g .08s infinite}@keyframes g{50%{transform:translate(4px,-3px)}}#monika{position:relative;overflow:hidden}.m{position:absolute;white-space:nowrap;font-size:clamp(25px,7vw,70px);font-weight:bold;animation:m 1s linear infinite}@keyframes m{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.35)}100%{transform:rotate(360deg) scale(1)}}#rush{position:relative}#rushButton{position:absolute;margin:0}#counter{position:fixed;top:15px;font-size:22px}#code{font-size:150px;font-weight:bold}#result{font-size:40px}
</style></head><body>
<section id="wordi" class="s"><h1>WORDI</h1><p id="wn"></p><input id="wi" placeholder="Введите слово"><button id="wb">ПРОВЕРИТЬ</button><p id="ws"></p></section>
<section id="buttons" class="s h"><h1>НАЖМИ 3 КНОПКИ</h1><div id="bs"></div></section>
<section id="ghost" class="s h">GHOST MENU</section>
<section id="monika" class="s h"></section>
<section id="rush" class="s h"><div id="counter">0 / 18</div><button id="rushButton">НАЖМИ</button></section>
<section id="codes" class="s h"><div id="code">(8)</div></section>
<section id="safe" class="s h"><div id="locked"><h1>СЕЙФ</h1><p>Введите код для открытия</p><input id="sc" maxlength="4" inputmode="numeric" placeholder="КОД"><br><button id="open">ОТКРЫТЬ СЕЙФ</button><p id="ss"></p></div><div id="result" class="h">tiktok.com/@glitch9390</div></section>
<script>
(()=>{const K="glitch9390_state_v7",W=["йоши","глитч","сайори"],C="8399",D=()=>({solved:0,last:null,stage:0,remain:3,rush:0,open:false});let s;
try{s=JSON.parse(localStorage.getItem(K))||D()}catch{s=D()}localStorage.setItem(K,JSON.stringify(s));
const old=["glitch9390_progress_v1","glitch9390_progress_v2","glitch9390_progress_v3","glitch9390_fresh_v4","glitch9390_persistent_v5","glitch9390_state_v6"];if(!localStorage.getItem(K)){old.forEach(x=>localStorage.removeItem(x))}
const q=id=>document.getElementById(id),all=["wordi","buttons","ghost","monika","rush","codes","safe"];
function save(){localStorage.setItem(K,JSON.stringify(s))}
function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function show(id){all.forEach(x=>q(x).classList.add("h"));q(id).classList.remove("h")}
let ac=null,timer=null,ni=0,notes=[261.6,329.6,392,523.3,392,329.6,293.7,349.2,440,587.3,440,349.2];
function music(){if(ac)return;try{ac=new AudioContext();let master=ac.createGain();master.gain.value=.04;master.connect(ac.destination);timer=setInterval(()=>{let o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=notes[ni++%notes.length];g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.25);o.connect(g);g.connect(master);o.start();o.stop(ac.currentTime+.27)},300)}catch(e){}}
document.addEventListener("pointerdown",music,{once:true});document.addEventListener("keydown",music,{once:true});
function word(){show("wordi");q("wn").textContent="Слово "+(s.solved+1)+" из 3";q("wi").value="";let ok=s.last!==today()&&s.solved<3;q("wi").disabled=!ok;q("wb").disabled=!ok;q("ws").textContent=ok?"":"Попытка уже использована. Возвращайся завтра."}
q("wb").onclick=()=>{if(s.last===today())return;s.last=today();if(q("wi").value.trim().toLowerCase()===W[s.solved]){s.solved++;if(s.solved===3){s.stage=1;s.last=null;save();buttons();return}q("ws").textContent="Верно! Следующее слово — завтра."}else q("ws").textContent="Неверно. Следующая попытка — завтра.";save();q("wi").disabled=q("wb").disabled=true};
q("wi").onkeydown=e=>{if(e.key==="Enter")q("wb").click()};
function buttons(){s.stage=1;save();show("buttons");q("bs").innerHTML="";for(let i=0;i<s.remain;i++){let b=document.createElement("button");b.textContent="НАЖМИ";b.onclick=()=>{b.remove();s.remain--;save();if(!s.remain)ghost()};q("bs").appendChild(b)}}
function ghost(){s.stage=2;save();show("ghost");setTimeout(()=>{if(s.stage===2)monika()},10000)}
let mt;function addM(){let x=document.createElement("div");x.className="m";x.textContent="JUST MONIKA";x.style.left=Math.random()*85+"%";x.style.top=Math.random()*85+"%";x.style.animationDuration=(.7+Math.random()*1.3)+"s";q("monika").appendChild(x);setTimeout(()=>x.remove(),3000)}
function monika(){show("monika");for(let i=0;i<12;i++)addM();clearInterval(mt);mt=setInterval(addM,250);setTimeout(()=>{clearInterval(mt);rush()},7000)}
function pos(){let b=q("rushButton");b.style.left=(30+Math.random()*Math.max(1,innerWidth-130))+"px";b.style.top=(70+Math.random()*Math.max(1,innerHeight-130))+"px"}
function rush(){s.stage=3;save();show("rush");q("counter").textContent=s.rush+" / 18";pos()}
q("rushButton").onclick=()=>{if(s.stage!==3)return;s.rush++;save();if(s.rush>=18){s.stage=4;save();show("codes");setTimeout(()=>{s.stage=5;save();show("safe")},1200)}else{q("counter").textContent=s.rush+" / 18";pos()}};
q("open").onclick=()=>{if(q("sc").value.trim()===C){s.open=true;s.stage=6;save();q("locked").classList.add("h");q("result").classList.remove("h")}else q("ss").textContent="Неверный код."};
function restore(){if(s.open||s.stage>=6){show("safe");q("locked").classList.add("h");q("result").classList.remove("h")}else if(s.stage===5)show("safe");else if(s.stage===4){show("codes");setTimeout(()=>{if(s.stage===4){s.stage=5;save();show("safe")}},1200)}else if(s.stage===3)rush();else if(s.stage===2)monika();else if(s.stage===1)buttons();else{s.stage=0;save();word()}}
restore()})()
</script></body></html>
