<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOORS — Главное меню</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;color:#eee}
body{background:radial-gradient(circle at 50% 25%,rgba(90,45,20,.28),transparent 35%),linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.78)),#090705;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:repeating-linear-gradient(90deg,#000 0,#000 2px,transparent 2px,transparent 90px)}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:38px 18px 50px}
.logo{font-size:clamp(48px,11vw,110px);font-weight:900;letter-spacing:8px;color:#eee;text-shadow:4px 5px 0 #27201b,0 0 25px #000;margin:8px 0 4px}
.subtitle{color:#b9a58e;font-size:clamp(14px,2.5vw,21px);letter-spacing:5px;text-transform:uppercase;margin-bottom:34px}
.menu{width:min(560px,94vw);display:flex;flex-direction:column;gap:16px}
button{position:relative;width:100%;min-height:76px;border:2px solid #8d775e;background:linear-gradient(90deg,#19130f,#2a211a,#17110d);color:#f2eadf;font:700 25px Georgia,serif;letter-spacing:2px;cursor:pointer;box-shadow:0 5px 0 #090705,inset 0 0 18px #000;transition:.16s transform,.16s filter,.16s border-color}
button:before,button:after{content:"";position:absolute;top:50%;width:24px;height:2px;background:#9b8062}
button:before{left:14px}button:after{right:14px}
button:hover{transform:scale(1.025);filter:brightness(1.25);border-color:#d1ad7f}button:active{transform:scale(.99)}
.small{display:block;font-size:12px;letter-spacing:3px;color:#a99682;margin-top:7px;font-weight:400}
.footer{margin-top:auto;padding-top:45px;color:#66584b;font-size:12px;letter-spacing:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}.card{width:min(1200px,96vw);max-height:94vh;overflow:auto;background:#0b0907;border:2px solid #806b53;box-shadow:0 0 50px #000;padding:14px}
.card h2{text-align:center;margin:4px 0 14px;font-size:28px;letter-spacing:3px}.card img{display:block;width:100%;height:auto}
.close{display:block;width:auto;min-height:auto;margin:12px auto 0;padding:10px 25px;font-size:17px}
.notice{text-align:center;padding:50px 20px 55px}.notice .icon{font-size:55px;margin-bottom:12px}.notice h2{font-size:32px;margin:5px}.notice p{color:#a99a89;font-size:17px}
@media(max-width:500px){button{min-height:68px;font-size:21px}.subtitle{letter-spacing:3px}}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">DOORS</div>
<div class="subtitle">Главное меню</div>
<div class="menu">
<button onclick="openTiers()">ТИР-ЛИСТ<span class="small">ПРЕДМЕТЫ И ИХ ПРИМЕРНЫЕ ЦЕНЫ</span></button>
<button onclick="soon()">МОНСТРЫ<span class="small">СПИСОК МОНСТРОВ — СКОРО</span></button>
<button onclick="soon()">КАЛЬКУЛЯТОР<span class="small">РАСЧЁТ — СКОРО</span></button>
</div>
<div class="footer">THE HOTEL • FAN SITE</div>
</div>
<div class="modal" id="tiers"><div class="card"><h2>ТИР-ЛИСТ ПРЕДМЕТОВ</h2><img src="1000002301.png" alt="Тир-лист предметов"><button class="close" onclick="closeTiers()">← НАЗАД</button></div></div>
<div class="modal" id="notice"><div class="card notice"><div class="icon">🚪</div><h2>СКОРО БУДЕТ</h2><p>Этот раздел пока находится в разработке.</p><button class="close" onclick="closeNotice()">← НАЗАД</button></div></div>
<script>
function openTiers(){document.getElementById('tiers').classList.add('show')}
function closeTiers(){document.getElementById('tiers').classList.remove('show')}
function soon(){document.getElementById('notice').classList.add('show')}
function closeNotice(){document.getElementById('notice').classList.remove('show')}
</script>
</body>
</html>
